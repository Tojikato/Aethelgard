<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#060606">
  <meta name="format-detection" content="telephone=no">
  <title>The Gates of Aethelgard</title>
  <meta name="description" content="A dark fantasy RPG. Cross the Abyssal Gate and remember who you are.">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="alternate icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./css/style.css">
  <script>
    // Safeguard against third-party browser extensions (translators, dictionary, grammar tools)
    // that blindly call window.getSelection().getRangeAt(0) when rangeCount is 0.
    (function() {
      // 1. Monkey-patch Selection.prototype.getRangeAt in the main execution context
      if (typeof Selection !== 'undefined' && Selection.prototype.getRangeAt) {
        const _origGetRangeAt = Selection.prototype.getRangeAt;
        Selection.prototype.getRangeAt = function(index) {
          if (index < 0 || index >= this.rangeCount) {
            const dummy = document.createRange();
            const root = document.body || document.documentElement;
            if (root) {
              dummy.setStart(root, 0);
              dummy.collapse(true);
            }
            return dummy;
          }
          return _origGetRangeAt.call(this, index);
        };
      }

      // 2. Wrap window.getSelection and document.getSelection so they always yield rangeCount >= 1
      const ensureSafeRange = () => {
        try {
          const sel = (typeof window !== 'undefined' && window.getSelection) ? window.getSelection() : null;
          if (sel && sel.rangeCount === 0) {
            const root = document.body || document.documentElement;
            if (root) {
              const range = document.createRange();
              range.setStart(root, 0);
              range.collapse(true);
              sel.addRange(range);
            }
          }
        } catch (_) {}
      };

      if (typeof window !== 'undefined' && window.getSelection) {
        const _origGetSelection = window.getSelection.bind(window);
        window.getSelection = function() {
          const sel = _origGetSelection();
          if (sel && sel.rangeCount === 0) {
            ensureSafeRange();
          }
          return sel;
        };
        if (document.getSelection) {
          document.getSelection = window.getSelection;
        }
      }

      // 3. Capture-phase listeners ensure that whenever the user clicks, focuses, moves, or types,
      // the DOM Selection has at least one valid collapsed range BEFORE extension handlers fire.
      const events = ['selectionchange', 'mouseup', 'mousedown', 'pointerup', 'touchend', 'keyup', 'focus', 'focusin'];
      events.forEach(evt => {
        document.addEventListener(evt, ensureSafeRange, { capture: true, passive: true });
        window.addEventListener(evt, ensureSafeRange, { capture: true, passive: true });
      });

      // 4. Global error suppressor as ultimate fallback for unhandled extension exceptions
      window.addEventListener('error', function(e) {
        if (e && (
          (e.message && e.message.includes('getRangeAt')) ||
          (e.error && e.error.message && e.error.message.includes('getRangeAt')) ||
          (e.filename && e.filename.includes('content.js'))
        )) {
          e.preventDefault();
          e.stopPropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && e.reason.message && e.reason.message.includes('getRangeAt')) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);

      const prevOnError = window.onerror;
      window.onerror = function(msg, url, line, col, error) {
        if (typeof msg === 'string' && msg.includes('getRangeAt')) {
          return true;
        }
        if (prevOnError) return prevOnError.apply(this, arguments);
      };

      // Initial check when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', ensureSafeRange, { once: true });
      } else {
        ensureSafeRange();
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-root"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
